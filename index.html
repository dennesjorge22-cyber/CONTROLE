<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TvTech – Controle de Recebimentos</title>
<style>
:root{--bg:#f4f1f9;--surface:#fff;--ink:#1d1630;--muted:#6b6482;--line:#ddd7ea;--ok:#12803f;--okbg:#dff3e6;--bad:#c62828;--badbg:#fbe3e3;--purple:#4b1f8f;--accent:#4b1f8f;--accent-ink:#fff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#140f22;--surface:#1e1733;--ink:#eee9fa;--muted:#a79fc0;--line:#352b52;--ok:#5fe39a;--okbg:#17382a;--bad:#ff8a8a;--badbg:#3d1b24;--accent:#9d73ee;--accent-ink:#140f22}}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
main{max-width:960px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 230px}
h2{font-size:1.1rem;margin:28px 0 10px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#000;color:#fff;border-radius:16px;padding:8px 16px 8px 8px;margin-bottom:18px;box-shadow:0 0 0 1px #3b2a66,0 6px 24px rgba(106,53,196,.25)}
header.top img{height:68px;width:auto;display:block}
header.top h1{font-size:1.2rem;margin:0;flex:1 1 180px;line-height:1.2}
header.top h1 small{display:block;font-weight:400;font-size:.8rem;color:#b9a9e0}
.exp{display:flex;gap:8px;flex-wrap:wrap}
.exp button{background:transparent;color:#fff;border:1px solid #7a55c9;border-radius:8px;padding:8px 14px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
.exp button:hover{background:#2a1a4d}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input,select,button{font:inherit}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.form{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:16px}
.wide{grid-column:1/-1}
@media(min-width:760px){.form{grid-template-columns:1fr 1.4fr 1fr 1fr 1fr auto;align-items:end}.wide{grid-column:auto}}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
.bar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
.bar>div{width:200px;max-width:100%}
.bar>.bk{width:auto;display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}
.ghost:hover{border-color:var(--accent)}
#dica{font-size:.9rem;color:var(--muted);margin:0 0 6px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:.85rem;color:var(--muted);font-weight:500}
.v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
td.ok{color:var(--ok)}td.bad{color:var(--bad)}
.tag{border:0;border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 8px;text-decoration:underline}
.empty{padding:28px;text-align:center;color:var(--muted)}
.ok-t{color:var(--ok);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
footer{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--purple);color:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(40,10,90,.35)}
.fin{max-width:960px;margin:0 auto}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.fhead b{font-size:1rem;text-transform:capitalize}
.fhead span{font-size:.9rem;color:#d9c9ff}
.meter{display:flex;height:14px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.18);margin:10px 0 12px}
.meter i{display:block;height:100%;transition:width .5s ease}
#mOk{background:#5fe39a}#mBad{background:#ff7d7d}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 10px;min-width:0}
.stats small{display:flex;align-items:center;gap:6px;font-size:.78rem;color:#d9c9ff}
.stats small:before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;flex:none}
.stats .g small:before{background:#5fe39a}.stats .r small:before{background:#ff7d7d}
.stats strong{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats .g strong{color:#8ff0bb}.stats .r strong{color:#ffa5a5}
@media(min-width:700px){.stats strong{font-size:1.5rem}.stats div{padding:10px 16px}}
@media(max-width:380px){.stats strong{font-size:.9rem}}
</style>
</head>

const KEY='recebimentos-v1';
let dados=[];
try{dados=(JSON.parse(localStorage.getItem(KEY)||'[]')||[]).map(d=>({...d,pago:d.pago!==false}))}catch(e){dados=[]}
const $=id=>document.getElementById(id);
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt=s=>s?s.split('-').reverse().join('/'):'';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoje=new Date();
$('cad').value=iso(hoje);$('pag').value=iso(hoje);$('filtro').value=iso(hoje).slice(0,7);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nomeMes=m=>{const [y,mo]=m.split('-');return new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const soma=l=>l.reduce((s,d)=>s+d.val,0);
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(dados))}catch(e){$('dica').textContent='Não foi possível salvar neste navegador.'}}
function resumoMeses(){const g={};dados.forEach(d=>{const k=d.pag.slice(0,7);g[k]=g[k]||{ok:0,bad:0};g[k][d.pago?'ok':'bad']+=d.val});return Object.keys(g).sort().reverse().map(k=>({k,...g[k]}))}
function atual(){const m=$('filtro').value;const lista=dados.filter(d=>d.pag.slice(0,7)===m).sort((a,b)=>a.pag.localeCompare(b.pag));const ok=soma(lista.filter(d=>d.pago)),bad=soma(lista.filter(d=>!d.pago));return{m,lista,ok,bad,all:ok+bad}}
function render(){
  const {m,lista,ok,bad,all}=atual();
  $('rows').innerHTML=lista.length?lista.map(d=>`<tr><td>${dt(d.cad)}</td><td>${esc(d.nome)}</td><td>${dt(d.pag)}</td><td class="v ${d.pago?'ok':'bad'}">${brl(d.val)}</td><td><button class="tag ${d.pago?'ok':'bad'}" data-t="${d.id}" aria-label="Alternar situação de ${esc(d.nome)}">${d.pago?'Pago':'Não pago'}</button></td><td><button class="x" data-id="${d.id}" aria-label="Excluir ${esc(d.nome)}">Excluir</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Nenhum lançamento neste mês. Preencha os campos acima e clique em Adicionar.</td></tr>';
  const pct=all?Math.round(ok/all*100):0;
  $('fMes').textContent=m?nomeMes(m):'—';
  $('fPct').textContent=pct+'% recebido · '+lista.length+(lista.length===1?' lançamento':' lançamentos');
  $('mOk').style.width=(all?ok/all*100:0)+'%';$('mBad').style.width=(all?bad/all*100:0)+'%';
  $('tOk').textContent=brl(ok);$('tBad').textContent=brl(bad);$('tAll').textContent=brl(all);
  const ms=resumoMeses();
  $('meses').innerHTML=ms.length?ms.map(r=>`<tr><td style="text-transform:capitalize">${nomeMes(r.k)}</td><td class="v ok-t">${brl(r.ok)}</td><td class="v bad-t">${brl(r.bad)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">Ainda sem dados.</td></tr>';
}
$('add').onclick=()=>{
  const nome=$('nome').value.trim();
  const val=parseFloat($('val').value.replace(/\./g,'').replace(',','.'));
  if(!nome||!$('pag').value||!(val>0)){$('dica').textContent='Preencha o nome, a data de pagamento e um valor maior que zero.';return}
  dados.push({id:Date.now()+''+Math.random().toString(16).slice(2),cad:$('cad').value,nome,pag:$('pag').value,val,pago:$('sta').value==='1'});
  salvar();$('filtro').value=$('pag').value.slice(0,7);
  $('nome').value='';$('val').value='';$('dica').textContent='Lançamento adicionado.';$('nome').focus();render();
};
$('rows').onclick=e=>{
  const t=e.target.dataset.t,id=e.target.dataset.id;
  if(t){const d=dados.find(x=>x.id===t);if(d){d.pago=!d.pago;salvar();render()}}
  else if(id&&confirm('Excluir este lançamento?')){dados=dados.filter(d=>d.id!==id);salvar();render()}
};
$('filtro').onchange=render;
['nome','val'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()}));

/* ---------- Download ---------- */
function baixar(bytes,nome,tipo){
  const url=URL.createObjectURL(new Blob([bytes],{type:tipo}));
  const a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},1500);
}

const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}})();
function zip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  for(const f of files){
    const name=enc.encode(f.name),data=enc.encode(f.data),crc=CRC(data);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(lh,name,data);
    cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=lh.length+name.length+data.length;
  }
  const cdLen=cd.reduce((s,a)=>s+a.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdLen),...u32(off),...u16(0)]);
  const all=[...parts,...cd,end],out=new Uint8Array(off+cdLen+end.length);let p=0;
  all.forEach(a=>{out.set(a,p);p+=a.length});return out;
}
const xe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sheetXml(rows,widths){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols><sheetData>';
  rows.forEach((r,ri)=>{x+=`<row r="${ri+1}">`;r.forEach((cell,ci)=>{if(cell==null)return;const o=typeof cell==='object'?cell:{v:cell};const ref=String.fromCharCode(65+ci)+(ri+1);const s=o.s?` s="${o.s}"`:'';x+=typeof o.v==='number'?`<c r="${ref}"${s}><v>${o.v}</v></c>`:`<c r="${ref}"${s} t="inlineStr"><is><t>${xe(o.v)}</t></is></c>`});x+='</row>'});
  return x+'</sheetData></worksheet>';
}

  const fix=s=>String(s).replace(/\u00a0/g,' ').replace(/[^\x20-\xff]/g,'?');
  const pe=s=>fix(s).replace(/([\\()])/g,'\\$1');
  const wd=s=>{let w=0;for(const ch of fix(s))w+=/\d/.test(ch)?.556:/[.,\s]/.test(ch)?.278:ch==='R'?.722:ch==='$'?.556:.55;return w};
  const pages=[];let c='',pn=0;
  const txt=(x,y,s,size=10,bold=false,color=INK,right=false)=>{if(right)x-=wd(s)*size;c+=`${color.join(' ')} rg BT /${bold?'F2':'F1'} ${size} Tf ${x.toFixed(1)} ${y} Td (${pe(s)}) Tj ET\n`};
  const rect=(x,y,w,h,col)=>{c+=`${col.join(' ')} rg ${x} ${y} ${w} ${h} re f\n`};
  const novaPagina=()=>{if(c)pages.push(c);c='';pn++;rect(0,0,595,34,PUR);txt(40,13,'TvTech - Controle de recebimentos',9,false,WHT);txt(555,13,'Página '+pn,9,false,WHT,true)};
  const cabTabela=y=>{txt(40,y,'Cadastro',9,true,GRY);txt(110,y,'Cliente',9,true,GRY);txt(300,y,'Pagamento',9,true,GRY);txt(460,y,'Valor',9,true,GRY,true);txt(485,y,'Situação',9,true,GRY);c+=`${GRY.join(' ')} RG 0.5 w 40 ${y-5} 515 0 re S\n`;return y-20};
  novaPagina();
  rect(0,752,595,90,[0,0,0]);
  const lh=70,lw=Math.round(lh*LOGO_W/LOGO_H);
  c+=`q ${lw} 0 0 ${lh} 24 762 cm /Im1 Do Q\n`;
  txt(24+lw+18,806,'Relatório de recebimentos',18,true,WHT);
  txt(24+lw+18,786,'Mês: '+(m?nomeMes(m):'-')+'   |   Gerado em '+hoje.toLocaleDateString('pt-BR'),10,false,[.8,.74,.95]);
  [['Recebido',ok,GRN,40],['Não pago',bad,RED,220],['Previsto',all,INK,400]].forEach(([l,v,col,x])=>{txt(x,722,l,9,false,GRY);txt(x,704,brl(v),15,true,col)});
  let y=cabTabela(670);
  if(!lista.length){txt(40,y,'Nenhum lançamento neste mês.',10,false,GRY);y-=20}
  lista.forEach(d=>{
    if(y<56){novaPagina();y=cabTabela(800)}
    const col=d.pago?GRN:RED;
    txt(40,y,dt(d.cad),10);txt(110,y,d.nome.length>34?d.nome.slice(0,33)+'.':d.nome,10);txt(300,y,dt(d.pag),10);
    txt(460,y,brl(d.val),10,true,col,true);txt(485,y,d.pago?'Pago':'Não pago',10,true,col);y-=18;
  });
  y-=14;
  const ms=resumoMeses();
  if(y<110){novaPagina();y=800}
  txt(40,y,'Mês a mês',13,true,PUR);y-=20;
  txt(40,y,'Mês',9,true,GRY);txt(330,y,'Recebido',9,true,GRY,true);txt(460,y,'Não pago',9,true,GRY,true);y-=18;
  ms.forEach(r=>{
    if(y<56){novaPagina();y=800}
    txt(40,y,nomeMes(r.k),10);txt(330,y,brl(r.ok),10,true,GRN,true);txt(460,y,brl(r.bad),10,true,RED,true);y-=18;
  });
  pages.push(c);
  const bin=atob(LOGO_B64),objs=[];
  const n=pages.length;
  objs.push('<< /Type /Catalog /Pages 2 0 R >>');
  objs.push('<< /Type /Pages /Kids ['+pages.map((_,i)=>(6+2*i)+' 0 R').join(' ')+'] /Count '+n+' >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  objs.push(`<< /Type /XObject /Subtype /Image /Width ${LOGO_W} /Height ${LOGO_H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bin.length} >>\nstream\n${bin}\nendstream`);
  pages.forEach((p,i)=>{
    objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << /Im1 5 0 R >> >> /Contents ${7+2*i} 0 R >>`);
    objs.push(`<< /Length ${p.length} >>\nstream\n${p}\nendstream`);
  });
  let out='%PDF-1.4\n';const offs=[];
  objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const xr=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const bytes=new Uint8Array(out.length);for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;
  baixar(bytes,'recebimentos-'+(m||'geral')+'.pdf','application/pdf');
}
/* ---------- Backup: exportar / importar ---------- */
$('bBk').onclick=()=>{
  if(!dados.length){$('dica').textContent='Ainda não há dados para exportar.';return}
  const pacote={app:'tvtech-recebimentos',versao:1,exportadoEm:new Date().toISOString(),dados};
  baixar(new TextEncoder().encode(JSON.stringify(pacote)),'recebimentos-backup-'+iso(new Date())+'.json','application/json');
  $('dica').textContent='Backup salvo ('+dados.length+' lançamentos). Envie o arquivo para o outro aparelho e use "Importar dados".';
};
$('bIm').onclick=()=>$('fIm').click();
$('fIm').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(r.result);
      const lista=Array.isArray(p)?p:p.dados;
      if(!Array.isArray(lista))throw new Error('formato inválido');
      const dataOk=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
      const ids=new Set(dados.map(d=>d.id));let novos=0,ignorados=0;
      lista.forEach(d=>{
        if(!d||typeof d.nome!=='string'||!dataOk(d.pag)||typeof d.val!=='number'||!(d.val>0)){ignorados++;return}
        const id=typeof d.id==='string'&&d.id?d.id:Date.now()+''+Math.random().toString(16).slice(2);
        if(ids.has(id)){return}
        ids.add(id);dados.push({id,cad:dataOk(d.cad)?d.cad:d.pag,nome:d.nome.slice(0,120),pag:d.pag,val:d.val,pago:d.pago!==false});novos++;
      });
      salvar();render();
      $('dica').textContent=novos+(novos===1?' lançamento importado':' lançamentos importados')+'. Os que já existiam neste aparelho foram mantidos'+(ignorados?' ('+ignorados+' inválidos ignorados)':'')+'.';
    }catch(err){$('dica').textContent='Não foi possível importar: o arquivo não é um backup válido.'}
    e.target.value='';
  };
  r.readAsText(f);
};
$('bXls').onclick=()=>{try{baixarExcel()}catch(e){$('dica').textContent='Não foi possível gerar o Excel: '+e.message}};
$('bPdf').onclick=()=>{try{baixarPdf()}catch(e){$('dica').textContent='Não foi possível gerar o PDF: '+e.message}};
render();
</script>
